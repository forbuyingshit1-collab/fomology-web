name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: PowerShell 5.1 tests
        shell: powershell
        run: .\tests\test_flux3_video.ps1
      - name: Current PowerShell tests
        shell: pwsh
        run: .\tests\test_flux3_video.ps1
      - name: Source integrity
        run: python tests/test_release_package.py
      - name: Build allowlisted ZIP and checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/build_release.py --source . --output "dist/create-flux3-video-v$version.zip"
      - name: Verify built archive
        run: python tests/test_release_package.py
      - name: Attach immutable release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
